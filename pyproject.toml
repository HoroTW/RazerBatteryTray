[project]
name = "razer-battery-tray"
version = "0.1.0"
dependencies = [
    "Pillow",
    "pystray",
]
requires-python = ">=3.10"

[project.scripts]
razer-battery-tray = "razer_battery_tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""